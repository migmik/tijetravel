services:
  # Servicio Backend API (JAR)
  - type: web
    name: tijetravel-backend
    env: docker
    dockerfilePath: tijetravel-backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "validate"

  # Servicio Frontend Web (WAR con JSP)
  - type: web
    name: tijetravel-frontend
    env: docker
    dockerfilePath: tijetravel-frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_API_URL
        sync: false
