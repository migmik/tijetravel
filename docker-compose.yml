version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tijetravel-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tijetravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: tijetravel-backend/Dockerfile
    container_name: tijetravel-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tijetravel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      ADMIN_BOOTSTRAP_USERNAME: admin
      ADMIN_BOOTSTRAP_PASSWORD: admin123
      ADMIN_BOOTSTRAP_DNI: "20111222"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: tijetravel-frontend/Dockerfile
    container_name: tijetravel-frontend
    restart: always
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      BACKEND_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  mysql_data:

